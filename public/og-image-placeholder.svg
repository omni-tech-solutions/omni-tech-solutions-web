<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fdba74;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)"/>

  <!-- Decorative tech elements -->
  <!-- Circuit board pattern in background -->
  <g opacity="0.1">
    <line x1="100" y1="100" x2="300" y2="100" stroke="white" stroke-width="2"/>
    <line x1="200" y1="100" x2="200" y2="200" stroke="white" stroke-width="2"/>
    <circle cx="100" cy="100" r="5" fill="white"/>
    <circle cx="300" cy="100" r="5" fill="white"/>
    <circle cx="200" cy="200" r="5" fill="white"/>

    <line x1="900" y1="400" x2="1100" y2="400" stroke="white" stroke-width="2"/>
    <line x1="1000" y1="400" x2="1000" y2="500" stroke="white" stroke-width="2"/>
    <circle cx="900" cy="400" r="5" fill="white"/>
    <circle cx="1100" cy="400" r="5" fill="white"/>
    <circle cx="1000" cy="500" r="5" fill="white"/>
  </g>

  <!-- Tech icons -->
  <!-- Code brackets icon -->
  <g transform="translate(150, 450)" opacity="0.3">
    <path d="M 0,15 L 15,0 L 15,5 L 5,15 L 15,25 L 15,30 L 0,15 Z" fill="white"/>
    <path d="M 50,15 L 35,0 L 35,5 L 45,15 L 35,25 L 35,30 L 50,15 Z" fill="white"/>
  </g>

  <!-- Network icon -->
  <g transform="translate(1000, 150)" opacity="0.3">
    <circle cx="0" cy="0" r="8" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="40" cy="0" r="8" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="20" cy="35" r="8" fill="none" stroke="white" stroke-width="2"/>
    <line x1="8" y1="0" x2="32" y2="0" stroke="white" stroke-width="2"/>
    <line x1="5" y1="6" x2="17" y2="30" stroke="white" stroke-width="2"/>
    <line x1="35" y1="6" x2="23" y2="30" stroke="white" stroke-width="2"/>
  </g>

  <!-- Server/Database icon -->
  <g transform="translate(950, 450)" opacity="0.3">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="none" stroke="white" stroke-width="2"/>
    <rect x="0" y="25" width="60" height="20" rx="4" fill="none" stroke="white" stroke-width="2"/>
    <rect x="0" y="50" width="60" height="20" rx="4" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="10" cy="10" r="3" fill="white"/>
    <circle cx="10" cy="35" r="3" fill="white"/>
    <circle cx="10" cy="60" r="3" fill="white"/>
  </g>

  <!-- Main content -->
  <text x="50%" y="42%" text-anchor="middle" fill="white" font-size="80" font-family="Arial, sans-serif" font-weight="bold">
    Omni Tech Solutions
  </text>

  <text x="50%" y="52%" text-anchor="middle" fill="white" font-size="36" font-family="Arial, sans-serif" opacity="0.95">
    Professional Technology Services
  </text>

  <!-- Service badges -->
  <g transform="translate(300, 520)">
    <rect x="0" y="0" width="180" height="45" rx="22.5" fill="rgba(255,255,255,0.2)"/>
    <text x="90" y="30" text-anchor="middle" fill="white" font-size="20" font-family="Arial, sans-serif" font-weight="600">
      Web Design
    </text>
  </g>

  <g transform="translate(510, 520)">
    <rect x="0" y="0" width="180" height="45" rx="22.5" fill="rgba(255,255,255,0.2)"/>
    <text x="90" y="30" text-anchor="middle" fill="white" font-size="20" font-family="Arial, sans-serif" font-weight="600">
      IT Solutions
    </text>
  </g>

  <g transform="translate(720, 520)">
    <rect x="0" y="0" width="200" height="45" rx="22.5" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="30" text-anchor="middle" fill="white" font-size="20" font-family="Arial, sans-serif" font-weight="600">
      Network Setup
    </text>
  </g>
</svg>
